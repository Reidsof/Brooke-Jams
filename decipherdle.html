<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link href="https://fonts.googleapis.com/css?family=Antic+Slab" rel="stylesheet">

        <title>Decipherdle</title>
        <style>
            body { font-family: 'Antic Slab', serif; text-align: center; touch-action: manipulation; padding-bottom: 190px; }
            #puzzle {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 1.25rem 1.5rem;
                max-width: 800px;
                margin: 1.5rem auto;
            }
            .word { display: flex; }           /* a word never breaks in the middle */
            .cell { width: 1.6rem; margin: 0 1px; cursor: pointer; user-select: none; scroll-margin-bottom: 200px; scroll-margin-top: 80px; }

            #keyboard {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
                background: #f2f2f2;
                border-top: 2px solid black;
            }

            .kb-row { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
            .kb-key {
                flex: 1 1 0;
                min-width: 0;
                max-width: 44px;
                height: 48px;
                font-family: inherit;
                font-size: 1.1rem;
                background: white;
                border: 1px solid black;
                border-radius: 6px;
                cursor: pointer;
                touch-action: manipulation;
            }
            .kb-key:active { background: black; color: white; }

            @media (max-width: 480px) {
                #puzzle { gap: 1rem 0.9rem; padding: 0 0.5rem; }
                .cell { width: 1.4rem; }
                .cell span { font-size: 1.2rem; }
            }

            .cell span { display: block; font-size: 1.4rem; }
            .cell .guess {
                height: 2rem;
                border-bottom: 2px solid black;
                color: steelblue;
            }
            .cell.hinted .guess { color: darkorange; }
            .cell.selected { background: rgba(255, 215, 0, 0.35); }
            .punct { font-size: 1.4rem; align-self: flex-start; }
            .solved .guess { color: green; }
            #timer { font-size: 1.5rem; }
            #copyMessage { white-space: pre-line; }
        </style>
    </head>
    <body>
        <a href="index.html">Home</a>
        <h1>Decipherdle</h1>
        <div id="puzzle"></div>

        <p id="status"></p>
        <button id="hintBtn">Hint (0 Used)</button>
        <p id="timer">0:00</p>
        <button id="shareBtn" hidden>Copy result</button>
        <p id="copyMessage"></p>
        <div id="keyboard" aria-label="On-screen keyboard"></div>
    </body>
    <script>
        let encrypted;

        const puzzleElement = document.getElementById('puzzle');
        const statusElement = document.getElementById('status');
        const hintBtn = document.getElementById('hintBtn');
        const keyboardElement = document.getElementById('keyboard');
        let hints = 0;
        const hinted = new Set();

        const guesses = {};
        let selected = null;
        let solved = false;

        const timerElement = document.getElementById('timer');
        const shareBtn = document.getElementById('shareBtn');
        const copyMessage = document.getElementById('copyMessage');

        let startTime = null;
        let elapsed = 0;
        let timerId = null;
        let finished = false;

        const START = new Date(2026, 10, 3);
        const dayNumber = Math.floor((new Date() - START ) / 86400000);

        const CANVAS_BORDER_COLOUR = 'black';
        const CANVAS_BACKGROUND_COLOUR = "white";

        const SAVE_KEY = 'decipherdle-' + dayNumber;

        const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split("");

        const PHRASES = [
            'They say a person needs just three things to be truly happy in this world: someone to love, something to do, and something to hope for.',
            'This above all: to thine own self be true, And it must follow, as the night the day, Thou canst not then be false to any man.',
            'There was a man who had an interesting job. He skipped, ran, jumped all day. He rolled through a window, tucking his legs to his chest.',
            'My neighbour started a new business of renting out his goats to clear weeds from overgrown properties. Seeing his success, I based mine off the same model.',
            'Since my cat learned to push doors open, she often finds herself trapped trapped inside my bedroom, having shut the door herself. As I lie in bed in the dark, I feel her snuggle up against me.'
        ]

        const phraseRand = mulberry32(dayNumber);
        const cipherRand = mulberry32(dayNumber + 1000);

        const phrase = PHRASES[dayNumber] ?? PHRASES[Math.floor(phraseRand() * PHRASES.length)];
        const cipher = cipherMapper(cipherRand);

        function formatTime(ms) {
            const total = Math.floor(ms / 1000);
            const minutes = Math.floor(total / 60);
            const seconds = String(total % 60).padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function updateTimer() {
            elapsed = Date.now() - startTime;
            timerElement.textContent = formatTime(elapsed);
        }

        function startTimer() {
            if (startTime !== null) return;
            startTime = Date.now();
            timerId = setInterval(updateTimer, 250);
        }

        function stopTimer() {
            clearInterval(timerId);
            if (startTime !== null) updateTimer();
        }

        function saveProgress() {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify({
                    encrypted, guesses, startTime, elapsed, finished, hints, hinted: [...hinted]
                }));
            } catch {

            }
        }

        function loadProgress() {
            let saved;
            try {
                saved = JSON.parse(localStorage.getItem(SAVE_KEY));
            } catch {
                return; 
            }

            if (!saved || saved.encrypted !== encrypted) return;

            for (const [c, g] of Object.entries(saved.guesses || {})) {
                if (lettersInPuzzle.has(c) && /^[A-Z]$/.test(g)) guesses[c] = g;
            }
            hints = Number(saved.hints) || 0;
            for (const c of saved.hinted || []) {
                if (lettersInPuzzle.has(c)) hinted.add(c);
            }
            if (saved.finished) {
                finished = true;
                elapsed = saved.elapsed;
                timerElement.textContent = formatTime(elapsed);
            } else if (saved.startTime) {
                startTime = saved.startTime;
                updateTimer();
                timerId = setInterval(updateTimer, 250);
            }
        }

        function mulberry32(seed) {
            return function () {
                seed |= 0; seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function giveHint() {
            if (solved) return;
            const wrong = [...lettersInPuzzle].filter(c => guesses[c] !== solution[c]);

            if (wrong.length === 0) return;

            let target;
            if (selected && wrong.includes(selected)) {
                target = selected;
            } else {
                const counts = {};
                for (const ch of encrypted) if (/[A-Z]/.test(ch)) counts[ch] = (counts[ch] || 0) + 1;
                target = wrong.reduce((a, b) => counts[b] > counts[a] ? b : a);
            }

            const plain = solution[target];
            for (const c in guesses) if (guesses[c] === plain) delete guesses[c];
            guesses[target] = plain;
            hinted.add(target);
            hints++;
            startTimer();
            hintBtn.blur();
            render();
        }

        hintBtn.onclick = giveHint;

        function shuffler(arr, rand = Math.random) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function cipherMapper(rand = Math.random) {
            let shuffled;
            do {
                shuffled = shuffler(ALPHABET, rand);
            } while (shuffled.some((letter, i) => letter === ALPHABET[i]));

            const cipherMap = {};

            ALPHABET.forEach((letter, index) => { cipherMap[letter] = shuffled[index]; });
            return cipherMap;
        }

        function encode(text, map) { return text.toUpperCase().replace(/[A-Z]/g, ch => map[ch]); }

        function invert(map) { return Object.fromEntries(Object.entries(map).map(([plain, cipher]) => [cipher, plain])); }

        function render() {
            solved = isSolved();

            if (solved && !finished) {
                finished = true;
                stopTimer();
            }

            shareBtn.hidden = !solved;
            keyboardElement.hidden = solved;
            hintBtn.textContent = `Hint (${hints} used)`;
            hintBtn.disabled = solved;

            function shareText() { 
                const hintLine = hints ? `\n${hints} hint${hints === 1 ? '' : 's'}` : '';
                return `Decipherdle #${dayNumber + 1}\n ${formatTime(elapsed)}${hintLine}`; 
            }

            shareBtn.onclick = async () => {
                const result = shareText();
                try {
                    await navigator.clipboard.writeText(result);
                    copyMessage.textContent = 'Copied to clipboard';
                } catch {
                    copyMessage.textContent = 'Copy this:\n' + result;
                }
            }; 

            puzzleElement.className = solved ? 'solved' : '';
            puzzleElement.innerHTML = '';

            encrypted.split(' ').forEach(word => {
                const wordElement = document.createElement('div');
                wordElement.className = 'word';

                [...word].forEach(ch => {
                    if (/[A-Z]/.test(ch)) {
                        const cell = document.createElement('div');
                        cell.className = 'cell' + (ch === selected ? ' selected' : '') + (hinted.has(ch) ? ' hinted' : '');
                        cell.dataset.letter = ch;
                        cell.innerHTML = `<span class="cipher">${ch}</span>` +
                            `<span class="guess">${guesses[ch] || ''}</span>`;
                        wordElement.appendChild(cell);
                    } else {
                        const punct = document.createElement('span');
                        punct.className = 'punct';
                        punct.textContent = ch;
                        wordElement.appendChild(punct);
                    }
                });
                puzzleElement.appendChild(wordElement);
            });

            const filled = [...lettersInPuzzle].filter(c => guesses[c]).length;
            statusElement.textContent = solved ? 'Solved!' : `${filled} of ${lettersInPuzzle.size} letters guessed`;
            saveProgress();
        }
        
        encrypted = encode(phrase, cipher);
        const solution = invert(cipher);
        const lettersInPuzzle = new Set(encrypted.match(/[A-Z]/g));
        
        loadProgress();
        render();

        function isSolved() {
            return [...lettersInPuzzle].every(c => guesses[c] === solution[c]);
        }

        function scrollToCursor() {
            const el = puzzleElement.querySelector(`.cell[data-index="${cursor}"]`);
            if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        function pressKey(key) {
            if (solved) return;

            if (key === 'ArrowLeft' || key === 'ArrowRight') {
                moveCursor(key === 'ArrowRight' ? 1 : -1); //  if key is arrow right, move cursor right, otherwise, move left
            } else {
                if (!selected) return;
                const locked = hinted.has(selected);

                if (/^[A-Z]$/.test(key)) {
                    if (locked) return;
                    if (Object.keys(guesses).some(c => hinted.has(c) && guesses[c] === key)) return;
                    for (const c in guesses) if (guesses[c] === key) delete guesses[c];
                        guesses[selected] = key;
                        moveCursor(1);
                        startTimer(); 
                } else if (key === 'Backspace' || key === 'Delete') {
                    if (locked) return;
                    delete guesses[selected];
                } else if (key === 'Escape') {
                    selected = null;
                } else {
                    return;
                }
            }
            render();
            if (selected) scrollToCursor();
        }
    
        puzzleElement.addEventListener('click', e => {
            const cell = e.target.closest('.cell');
            if (!cell || solved) return;
            selected = cell.dataset.letter;
            render();
        });

        document.addEventListener('keydown', e => {

    </script>
</html>
