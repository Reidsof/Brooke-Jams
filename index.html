<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Brooke Jams</title>
        <link href="https://fonts.googleapis.com/css?family=Antic+Slab" rel="stylesheet">

        <style>
            body {
                margin: 0;
                font-family: 'Antic Slab', serif;
                background: #020016;
            }
            .site-header {
                display:flex;
                align-items: center;
                height: 56px;
                padding: 0 1rem;
                border-bottom: 2px solid black;
                background: white;
            }
            .home-btn { display: inline-flex; border-radius: 6px;}
            .home-btn img { height: 36px; width: auto; display: block; }
            .home-btn:hover { background: rgba(0,0,0,0.08); }
            .home-btn:focus-visible { outline: 3px solid steelblue; }

            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2rem;
                padding: 3rem 1rem;
            }
            h1 { font-size: 4rem; margin: 0; color: white; }

            .games { 
                display: grid; 
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
                gap: 1.5rem; 
                width: 100%;
                max-width: 900px;
            }

            .game-card {
                display: flex;
                align-items: center;
                gap: 1.25rem;
                padding: 1rem;
                background: #9c65f5;
                color: black;
                text-decoration: none;
                border: 2px solid #5e23bd;
                border-radius: 8px;
            }
            .game-card:hover { background: #5e23bd; color: white; }
            .game-card:focus-visible { outline: 3px solid white; outline-offset: 2px; }
            .game-card img {
                width: 96px;
                height: 96px;
                flex-shrink: 0;
                object-fit: cover;
                border-radius: 6px;
            }

            .game-text { min-width: 0; }
            .game-text h2 { margin: 0 0 0.25rem; font-size: 1.75rem; }
            .game-text p { margin: 0; font-size: 1rem; line-height: 1.35; }
        </style>
    </head>
    <body>
        <header class="site-header">
            <a href="index.html" class="home-btn"><img src="BROOKEJAMS_HOME.png" alt="Home"></a>
        </header>
        <main>
            <h1>Brooke Jams</h1>
            <div class="games">
                <a class="game-card" href="tictactoe.html">
                    <img src="tictactoe.png" alt="">
                    <div class="game-text">
                        <h2>Tic-Tac-Toe</h2>
                        <p>Play the classic 2 player versus game.</p>
                    </div>
                </a>
                <a class="game-card" href="capture-the-emperor.html">
                    <img src="CTE.png" alt="">
                    <div class="game-text">
                        <h2>Capture the Emperor</h2>
                        <p>Play against someone in a turn-based strategy game.</p>
                    </div>
                </a>
                <a class="game-card" href="decipherdle.html">
                    <img src="decipherdle.png" alt="">
                    <div class="game-text">
                        <h2>Decipherdle</h2>
                        <p>Play this daily decipher game and figure out today's encrypted phrase.</p>
                    </div>
                </a>
            </div>
        </main>
    </body>
</html>
